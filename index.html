<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyGram CEO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #090d16; color: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
        .header { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; text-align: center; }
        .score { font-size: 30px; font-weight: bold; color: #facc15; margin: 10px 0; text-align: center; }
        .btn { background: #0ea5e9; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; text-align: center; }
        .btn-green { background: #10b981; }
        .tabs { display: flex; width: 100%; gap: 4px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px 4px; background: #1e293b; border: none; color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 11px; text-align: center; }
        .tab-btn.active { background: #0ea5e9; color: #fff; }
        .tab-content { display: none; width: 100%; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; width: 100%; margin-bottom: 8px; text-align: left; }
        .input { width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">BabyGram CEO</div>
        <div class="score" id="scoreEl">0</div>
        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 10px;">Total Balance</div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-click">Clicker</button>
            <button class="tab-btn" data-tab="tab-ceo">CEO Cards</button>
            <button class="tab-btn" data-tab="tab-wallet">Wallet</button>
            <button class="tab-btn" data-tab="tab-ref">Invite</button>
        </div>

        <!-- Tab 1: Clicker -->
        <div id="tab-click" class="tab-content active">
            <div class="box" style="text-align: center;">
                <button class="btn btn-green" id="tapBtn" style="width: 130px; height: 130px; border-radius: 50%; font-size: 18px; margin: 15px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);">TAP 🪙</button>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Energy: <span id="energyEl">100</span> / 100</div>
            </div>
        </div>

        <!-- Tab 2: CEO -->
        <div id="tab-ceo" class="tab-content">
            <div class="box">
                <div style="font-weight: bold; color: #38bdf8; margin-bottom: 8px;">Profit Upgrades</div>
                <div style="background: #000; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-size: 12px; font-weight: bold;">Server Setup</div>
                        <div style="font-size: 10px; color: #38bdf8;">Profit: +20/h</div>
                    </div>
                    <button class="btn btn-green" style="width: auto; padding: 6px 10px; font-size: 11px; margin: 0;">300 Coins</button>
                </div>
            </div>
        </div>

        <!-- Tab 3: Wallet -->
        <div id="tab-wallet" class="tab-content">
            <div class="box">
                <div style="font-weight: bold; color: #38bdf8; margin-bottom: 5px;">TON Wallet Address</div>
                <div style="font-size: 11px; color: #10b981; margin-bottom: 5px;" id="walletStatus">Status: Not Connected</div>
                <input type="text" id="walletInput" class="input" placeholder="EQ...">
                <button class="btn btn-green" id="saveWalletBtn" style="margin-top: 8px;">Save Wallet</button>
            </div>
        </div>

        <!-- Tab 4: Invite -->
        <div id="tab-ref" class="tab-content">
            <div class="box">
                <div style="font-weight: bold; color: #38bdf8; margin-bottom: 5px;">Invite Friends</div>
                <input type="text" id="refInput" class="input" readonly>
                <button class="btn" id="copyBtn" style="margin-top: 8px;">Copy Invite Link</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.expand();
                }
            } catch (e) {}

            let score = parseInt(localStorage.getItem('bg_score')) || 0;
            let energy = 100;
            let wallet = localStorage.getItem('bg_wallet') || '';

            const scoreEl = document.getElementById('scoreEl');
            const tapBtn = document.getElementById('tapBtn');
            const energyEl = document.getElementById('energyEl');
            const walletInput = document.getElementById('walletInput');
            const saveWalletBtn = document.getElementById('saveWalletBtn');
            const walletStatus = document.getElementById('walletStatus');
            const refInput = document.getElementById('refInput');
            const copyBtn = document.getElementById('copyBtn');

            function updateUI() {
                scoreEl.innerText = score.toLocaleString();
                energyEl.innerText = energy;
                localStorage.setItem('bg_score', score);
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    const targetTab = document.getElementById(this.getAttribute('data-tab'));
                    if (targetTab) targetTab.classList.add('active');
                });
            });

            if (tapBtn) {
                const handleTap = (e) => {
                    if (e) e.preventDefault();
                    if (energy >= 2) {
                        energy -= 2;
                        score += 1;
                        updateUI();
                    }
                };
                tapBtn.addEventListener('click', handleTap);
                tapBtn.addEventListener('touchstart', handleTap, { passive: false });
            }

            setInterval(() => {
                if (energy < 100) {
                    energy += 1;
                    if (energyEl) energyEl.innerText = energy;
                }
            }, 1000);

            if (wallet && walletInput) {
                walletInput.value = wallet;
                if (walletStatus) walletStatus.innerText = 'Connected: ' + wallet.substring(0, 6) + '...';
            }

            if (saveWalletBtn) {
                saveWalletBtn.addEventListener('click', function () {
                    let val = walletInput.value.trim();
                    if (val.startsWith('EQ') && val.length > 10) {
                        localStorage.setItem('bg_wallet', val);
                        if (walletStatus) walletStatus.innerText = 'Successfully saved!';
                        alert('Wallet address saved successfully.');
                    } else {
                        alert('Invalid address. Must start with EQ.');
                    }
                });
            }

            let userId = '7098265955';
            try {
                if (window.Telegram && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    userId = window.Telegram.WebApp.initDataUnsafe.user.id;
                }
            } catch (e) {}

            if (refInput) {
                refInput.value = 'https://t.me/BabyGramClicker_bot?start=ref_' + userId;
            }

            if (copyBtn) {
                copyBtn.addEventListener('click', function () {
                    if (refInput) {
                        navigator.clipboard.writeText(refInput.value);
                        alert('Invite link copied!');
                    }
                });
            }

            updateUI();
        });
    </script>
</body>
</html>
