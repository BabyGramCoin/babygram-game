<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyGram Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c2541;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .top-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-small {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .lang-btn {
            background: #48cae4;
            color: #0b132b;
        }
        .wallet-btn {
            background: linear-gradient(135deg, #3a86ff, #4ea8de);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .card {
            background: #1c2541;
            border-radius: 16px;
            padding: 15px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .coin-container {
            width: 110px;
            height: 110px;
            margin: 10px auto;
        }
        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(58, 134, 255, 0.5);
        }
        .btn-main {
            background: linear-gradient(135deg, #4ea8de, #3a86ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-verify {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }
        .btn-verified-done {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: default;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            display: none;
        }
        .btn-auto-upgrade {
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }
        .btn-withdraw {
            background: linear-gradient(135deg, #f77f00, #fcbf49);
            color: #0b132b;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            text-decoration: none;
            display: inline-block;
        }
        .timer {
            font-size: 22px;
            color: #4cc9f0;
            margin: 8px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .option-btn {
            background: #2b2d42;
            color: white;
            border: 1px solid #48cae4;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
        }
        .option-btn.active {
            border-color: #ffb703;
            background: #1d3557;
        }
        .holding-box, .task-box {
            background: #111827;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            text-align: right;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            background: #1c2541;
            padding: 8px;
            border-radius: 8px;
        }
        .task-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .task-btn.done {
            background: #4b5563;
            cursor: default;
        }
        .friend-list {
            max-height: 90px;
            overflow-y: auto;
            margin-top: 8px;
            font-size: 11px;
            color: #d1d5db;
            text-align: right;
            padding: 5px;
            background: #1c2541;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="balanceText">موجودی: <strong>0</strong> $BABYGRAM</span>
        <div class="top-btns">
            <button class="wallet-btn" onclick="connectWallet()" id="walletBtn">اتصال کیف پول</button>
            <button class="btn-small lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
        </div>
    </div>

    <div class="card">
        <h2 id="titleText" style="margin-top: 5px; font-size: 16px;">استخراج BabyGram 💎</h2>
        
        <div class="coin-container">
            <img src="https://raw.githubusercontent.com/BabyGramCoin/babygram-game/main/IMG_20261107_051306_534.jpg" alt="BabyGram Coin" class="coin-img">
        </div>

        <div class="timer" id="countdown">00:00:00</div>
        <p id="status" style="font-size: 11px; color: #adb5bd; margin: 5px 0;">ظرفیت: انتخاب پاداش</p>

        <button class="btn-verify" id="verifyBtn" onclick="verifyWalletWithFee()">🛡 تایید هویت کیف پول (0.01 TON)</button>
        <button class="btn-verified-done" id="verifiedDoneBtn">تایید هویت شده ✅ (ضریب 2x)</button>
        <button class="btn-auto-upgrade" onclick="buyAutoMiner()">⚡️ خرید جمع‌کننده خودکار (0.5 TON)</button>

        <div class="holding-box">
            <span id="holdingStatus">💎 سطح هولد: عادی (ضریب 1x)</span><br>
            <span id="holdingBonus" style="color: #34d399; font-size: 10px;">ابتدا تایید هویت را انجام دهید.</span>
        </div>

        <div class="options">
            <button class="option-btn active" id="opt4" onclick="setParams(4, 50)">۴ ساعته<br><small>⚡️ ۵۰ توکن</small></button>
            <button class="option-btn" id="opt8" onclick="setParams(8, 120)">۸ ساعته<br><small>⚡️ ۱۲۰ توکن</small></button>
            <button class="option-btn" id="opt12" onclick="setParams(12, 200)">۱۲ ساعته<br><small>⚡️ ۲۰۰ توکن</small></button>
            <button class="option-btn" id="opt24" onclick="setParams(24, 450)">۲۴ ساعته<br><small>⚡️ ۴۵۰ توکن</small></button>
        </div>

        <button class="btn-main" id="actionBtn" onclick="toggleMining()">شروع استخراج</button>
        <button class="btn-withdraw" id="withdrawBtn" onclick="withdrawTokens()">برداشت به کیف پول (حداقل ۱۰,۰۰۰)</button>
        
        <a href="https://app.tonkeeper.com/dapp/https%3A%2F%2Fdedust.io%2Fswap%2FGRAM%2FEQCdD5RJr7H63xefQB57nKi7nRI2TMZ27q_3KGYV5Phuw3Ql" target="_blank" class="btn-buy" id="buyBtn">
            🛒 خرید مستقیم و هولد روی Dedust
        </a>
    </div>

    <div class="card">
        <h3 id="taskTitle" style="font-size: 14px; margin-top: 0; color: #4cc9f0;">🎁 تسک‌ها و پاداش‌ها</h3>
        
        <div class="task-item">
            <span id="channelTaskText" style="font-size: 11px;">عضویت در کانال تلگرام (+۵۰۰ توکن)</span>
            <button class="task-btn" id="channelBtn" onclick="joinChannel()">بررسی</button>
        </div>

        <div class="task-box">
            <span id="refTitle" style="font-weight: bold; color: #fbbf24; font-size: 11px;">👥 دعوت از دوستان (+۵۰۰ توکن)</span><br>
            <button class="btn-main" style="margin-top: 6px; font-size: 12px; padding: 6px;" onclick="getRefLink()">دریافت لینک دعوت</button>
            
            <div style="margin-top: 8px; font-weight: bold; font-size: 11px; color: #4cc9f0;">دوستان دعوت‌شده (<span id="friendCount">0</span>):</div>
            <div class="friend-list" id="friendListContainer">
                <div style="text-align: center; color: #6b7280; padding: 3px;">هنوز دوستی دعوت نشده</div>
            </div>
        </div>
    </div>

    <script>
        // متغیرهای اصلی بازی
        let currentLang = 'fa';
        let isMining = false;
        let selectedHours = 4;
        let baseReward = 50;
        let finalReward = 50;
        let userBalance = 100; // مقدار اولیه برای تست دکمه‌ها
        let walletConnected = false;
        let walletVerified = false;
        let userHoldingTier = 1;
        let channelJoined = false;

        const OWNER_WALLET = "UQB8E5UreO3ujV4ArV9AI28kGhznU-9ExPDjn6bQ2v9NJEj1";

        // شناسه تلگرام کاربر
        let userTelegramId = "user_" + Math.floor(Math.random() * 1000000);
        try {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                userTelegramId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
            }
        } catch (e) {
            console.log("Telegram WebApp not detected");
        }

        // بارگذاری اولیه صفحه و اطلاعات
        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });

        function updateUI() {
            finalReward = baseReward * userHoldingTier;
            const balEl = document.getElementById('balanceText');
            if (balEl) {
                balEl.innerHTML = `موجودی: <strong>${userBalance.toFixed(0)}</strong> $BABYGRAM`;
            }
            if (!isMining) {
                const statusEl = document.getElementById('status');
                if (statusEl) {
                    statusEl.innerText = `ظرفیت: ${selectedHours} ساعت (پاداش: ${finalReward} توکن)`;
                }
            }
        }

        function setParams(hours, reward) {
            if (isMining) return;
            selectedHours = hours;
            baseReward = reward;
            document.querySelectorAll('.options button').forEach(b => b.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            updateUI();
        }

        function toggleMining() {
            const btn = document.getElementById('actionBtn');

            if (!isMining) {
                isMining = true;
                finalReward = baseReward * userHoldingTier;
                let totalSec = selectedHours * 3600;

                btn.innerText = currentLang === 'fa' ? "در حال استخراج..." : "Mining...";
                btn.style.background = "#e63946";
                startTimerEngine(totalSec);
            } else {
                userBalance += finalReward;
                isMining = false;
                document.getElementById('countdown').innerText = "00:00:00";
                btn.innerText = currentLang === 'fa' ? "شروع استخراج" : "Start Mining";
                btn.style.background = "linear-gradient(135deg, #4ea8de, #3a86ff)";
                
                updateUI();
                alert(currentLang === 'fa' ? `تبریک! ${finalReward} توکن اضافه شد.` : `Received ${finalReward} tokens.`);
            }
        }

        function startTimerEngine(durationSec) {
            let timeLeft = durationSec;
            const btn = document.getElementById('actionBtn');
            
            let timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let h = Math.floor(timeLeft / 3600);
                    let m = Math.floor((timeLeft % 3600) / 60);
                    let s = timeLeft % 60;
                    const cdEl = document.getElementById('countdown');
                    if (cdEl) {
                        cdEl.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    }
                } else {
                    clearInterval(timerInterval);
                    isMining = false;
                    btn.innerText = currentLang === 'fa' ? "برداشت و دریافت پاداش" : "Claim Reward";
                    btn.style.background = "linear-gradient(135deg, #4ea8de, #3a86ff)";
                }
            }, 1000);
        }

        function connectWallet() {
            alert(currentLang === 'fa' ? "در حال اتصال به کیف پول..." : "Connecting wallet...");
            walletConnected = true;
            document.getElementById('walletBtn').innerText = currentLang === 'fa' ? "متصل شد ✅" : "Connected ✅";
        }

        function verifyWalletWithFee() {
            alert(currentLang === 'fa' ? "تایید هویت با موفقیت انجام شد! ضریب شما 2x شد." : "Verification successful!");
            walletVerified = true;
            userHoldingTier = 2;
            document.getElementById('verifyBtn').style.display = 'none';
            document.getElementById('verifiedDoneBtn').style.display = 'block';
            document.getElementById('holdingStatus').innerText = "💎 سطح هولد: تایید شده (ضریب 2x)";
            document.getElementById('holdingBonus').innerText = "تایید هویت موفقیت‌آمیز بود! 🎉";
            updateUI();
        }

        function buyAutoMiner() {
            alert(currentLang === 'fa' ? "جمع‌کننده خودکار فعال شد!" : "Auto-miner activated!");
        }

        function joinChannel() {
            if (channelJoined) return;
            window.open("https://t.me/babyGramhub", "_blank");
            setTimeout(() => {
                channelJoined = true;
                userBalance += 500;
                let btn = document.getElementById('channelBtn');
                if (btn) {
                    btn.innerText = "انجام شد ✅";
                    btn.classList.add('done');
                }
                updateUI();
                alert("پاداش ۵۰۰ توکنی به حساب شما اضافه شد!");
            }, 2000);
        }

        function getRefLink() {
            const refLink = `https://t.me/BabyGramClicker_bot?start=${userTelegramId}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(refLink).then(() => {
                    alert("لینک دعوت شما با موفقیت کپی شد: \n" + refLink);
                }).catch(() => {
                    prompt("لینک دعوت شما:", refLink);
                });
            } else {
                prompt("لینک دعوت شما:", refLink);
            }
        }

        function withdrawTokens() {
            if (userBalance < 10000) {
                alert(currentLang === 'fa' ? "حداقل موجودی برای برداشت ۱۰,۰۰۰ توکن است!" : "Minimum withdrawal is 10,000 tokens!");
                return;
            }
            alert(currentLang === 'fa' ? "درخواست برداشت شما ثبت شد." : "Withdrawal requested.");
        }

        function toggleLanguage() {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            const langBtn = document.getElementById('langBtn');
            if (langBtn) langBtn.innerText = currentLang === 'fa' ? 'EN' : 'FA';
            
            const htmlTag = document.getElementById('htmlTag');
            if (htmlTag) {
                htmlTag.setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
                htmlTag.setAttribute('lang', currentLang === 'fa' ? 'fa' : 'en');
            }
            updateUI();
        }
    </script>
</body>
</html>
