<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyGram Miner</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c2541;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .top-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-small {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .lang-btn {
            background: #48cae4;
            color: #0b132b;
        }
        .wallet-btn {
            background: linear-gradient(135deg, #3a86ff, #4ea8de);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .card {
            background: #1c2541;
            border-radius: 16px;
            padding: 15px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .coin-container {
            width: 110px;
            height: 110px;
            margin: 10px auto;
        }
        .coin-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(58, 134, 255, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .btn-main {
            background: linear-gradient(135deg, #4ea8de, #3a86ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-verify {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }
        .btn-verified-done {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: default;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            display: none;
        }
        .btn-auto-upgrade {
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }
        .btn-withdraw {
            background: linear-gradient(135deg, #f77f00, #fcbf49);
            color: #0b132b;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            text-decoration: none;
            display: inline-block;
        }
        .timer {
            font-size: 22px;
            color: #4cc9f0;
            margin: 8px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .option-btn {
            background: #2b2d42;
            color: white;
            border: 1px solid #48cae4;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
        }
        .option-btn.active {
            border-color: #ffb703;
            background: #1d3557;
        }
        .holding-box, .task-box {
            background: #111827;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            text-align: right;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            background: #1c2541;
            padding: 8px;
            border-radius: 8px;
        }
        .task-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .task-btn.done {
            background: #4b5563;
            cursor: default;
        }
        .friend-list {
            max-height: 90px;
            overflow-y: auto;
            margin-top: 8px;
            font-size: 11px;
            color: #d1d5db;
            text-align: right;
            padding: 5px;
            background: #1c2541;
            border-radius: 6px;
        }
        .friend-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #374151;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="balanceText">موجودی: <strong>0</strong> $BABYGRAM</span>
        <div class="top-btns">
            <button class="wallet-btn" onclick="connectWallet()" id="walletBtn">اتصال کیف پول</button>
            <button class="btn-small lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
        </div>
    </div>

    <!-- بخش اصلی استخراج -->
    <div class="card">
        <h2 id="titleText" style="margin-top: 5px; font-size: 16px;">استخراج BabyGram 💎</h2>
        
        <div class="coin-container">
            <img src="https://raw.githubusercontent.com/BabyGramCoin/babygram-game/main/IMG_20261107_051306_534.jpg" alt="BabyGram Coin" class="coin-img">
        </div>

        <div class="timer" id="countdown">00:00:00</div>
        <p id="status" style="font-size: 11px; color: #adb5bd; margin: 5px 0;">ظرفیت: انتخاب پاداش</p>

        <!-- دکمه تایید هویت -->
        <button class="btn-verify" id="verifyBtn" onclick="verifyWalletWithFee()">🛡 تایید هویت کیف پول (0.01 TON)</button>
        <button class="btn-verified-done" id="verifiedDoneBtn">تایید هویت شده ✅ (ضریب 2x)</button>

        <!-- دکمه خرید جمع‌کننده خودکار -->
        <button class="btn-auto-upgrade" onclick="buyAutoMiner()">⚡️ خرید جمع‌کننده خودکار (0.5 TON)</button>

        <div class="holding-box">
            <span id="holdingStatus">💎 سطح هولد: عادی (ضریب 1x)</span><br>
            <span id="holdingBonus" style="color: #34d399; font-size: 10px;">ابتدا تایید هویت را انجام دهید.</span>
        </div>

        <div class="options">
            <button class="option-btn active" id="opt4" onclick="setParams(4, 50)">۴ ساعته<br><small>⚡️ ۵۰ توکن</small></button>
            <button class="option-btn" id="opt8" onclick="setParams(8, 120)">۸ ساعته<br><small>⚡️ ۱۲۰ توکن</small></button>
            <button class="option-btn" id="opt12" onclick="setParams(12, 200)">۱۲ ساعته<br><small>⚡️ ۲۰۰ توکن</small></button>
            <button class="option-btn" id="opt24" onclick="setParams(24, 450)">۲۴ ساعته<br><small>⚡️ ۴۵۰ توکن</small></button>
        </div>

        <button class="btn-main" id="actionBtn" onclick="toggleMining()">شروع استخراج</button>
        <button class="btn-withdraw" id="withdrawBtn" onclick="withdrawTokens()">برداشت به کیف پول (حداقل ۱۰,۰۰۰)</button>
        
        <a href="https://app.tonkeeper.com/dapp/https%3A%2F%2Fdedust.io%2Fswap%2FGRAM%2FEQCdD5RJr7H63xefQB57nKi7nRI2TMZ27q_3KGYV5Phuw3Ql" target="_blank" class="btn-buy" id="buyBtn">
            🛒 خرید مستقیم و هولد روی Dedust
        </a>
    </div>

    <!-- بخش تسک‌ها و دعوت از دوستان -->
    <div class="card">
        <h3 id="taskTitle" style="font-size: 14px; margin-top: 0; color: #4cc9f0;">🎁 تسک‌ها و پاداش‌ها</h3>
        
        <div class="task-item">
            <span id="channelTaskText" style="font-size: 11px;">عضویت در کانال تلگرام (+۵۰۰ توکن)</span>
            <button class="task-btn" id="channelBtn" onclick="joinChannel()">بررسی</button>
        </div>

        <div class="task-box">
            <span id="refTitle" style="font-weight: bold; color: #fbbf24; font-size: 11px;">👥 دعوت از دوستان (+۵۰۰ توکن)</span><br>
            <button class="btn-main" style="margin-top: 6px; font-size: 12px; padding: 6px;" onclick="getRefLink()">دریافت لینک دعوت</button>
            
            <div style="margin-top: 8px; font-weight: bold; font-size: 11px; color: #4cc9f0;">دوستان دعوت‌شده (<span id="friendCount">0</span>):</div>
            <div class="friend-list" id="friendListContainer">
                <div style="text-align: center; color: #6b7280; padding: 3px;">هنوز دوستی دعوت نشده</div>
            </div>
        </div>
    </div>

    <script>
        // اتصال به دیتابیس Supabase
        const supabaseUrl = 'https://wuycoooqypvrgoxyetsm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1eWNvb29xeXB2cmdveHlldHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0Mzk2MDksImV4cCI6MjExMDAxNTYwOX0.ronYWbeEytYBB7hVOWDyhoPi6F1_LuQDUbR4gZl-TQ0';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // گرفتن شناسه واقعی کاربر از تلگرام
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        const userTelegramId = tgUser ? tgUser.id.toString() : "guest_" + Math.floor(Math.random() * 1000000);

        let currentLang = 'fa';
        let isMining = false;
        let selectedHours = 4;
        let baseReward = 50;
        let finalReward = 50;
        let userBalance = 0;
        let walletConnected = false;
        let walletVerified = false;
        let userHoldingTier = 1;
        let channelJoined = false;
        let invitedFriends = [];

        const OWNER_WALLET = "UQB8E5UreO3ujV4ArV9AI28kGhznU-9ExPDjn6bQ2v9NJEj1";
        const ADMIN_TELEGRAM = "BabyGramOfficial";

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/BabyGramCoin/babygram-game/main/tonconnect-manifest.json',
            actionsConfiguration: {
                twaReturnUrl: 'https://t.me/BabyGramClicker_bot'
            }
        });

        // تابع همگام‌سازی و ذخیره ابری اطلاعات کاربر در Supabase
        async function syncUserToDatabase() {
            const { data, error } = await supabase
                .from('users')
                .upsert([
                    { 
                        telegram_id: userTelegramId, 
                        balance: userBalance, 
                        verified: walletVerified, 
                        holding_tier: userHoldingTier 
                    }
                ], { onConflict: 'telegram_id' })
                .select();

            if (error) {
                console.error('خطا در ذخیره ابری اطلاعات:', error.message);
            } else {
                console.log('اطلاعات با موفقیت در Supabase ذخیره شد:', data);
            }
        }

        // بارگذاری اطلاعات کاربر از دیتابیس ابری به محض ورود
        async function loadUserDataFromCloud() {
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('telegram_id', userTelegramId)
                .single();

            if (data) {
                userBalance = data.balance || 0;
                walletVerified = data.verified || false;
                userHoldingTier = data.holding_tier || 1;

                if (walletVerified) {
                    document.getElementById('verifyBtn').style.display = 'none';
                    document.getElementById('verifiedDoneBtn').style.display = 'block';
                    document.getElementById('holdingStatus').innerText = "💎 سطح هولد: تایید شده (ضریب 2x)";
                    document.getElementById('holdingBonus').innerText = "تایید هویت قبلاً انجام شده است ✅";
                }
                updateUI();
            } else {
                // اگر کاربر جدید بود، در دیتابیس ثبتش می‌کنیم
                syncUserToDatabase();
            }
        }

        // اجرای لود داده‌ها هنگام بارگذاری صفحه
        window.addEventListener('DOMContentLoaded', () => {
            loadUserDataFromCloud();
        });

        async function connectWallet() {
            try {
                if (tonConnectUI.connected) {
                    await tonConnectUI.disconnect();
                    return;
                }
                await tonConnectUI.openModal();
            } catch (error) {
                console.error("Connection error:", error);
            }
        }

        tonConnectUI.onStatusChange(walletInfo => {
            if (walletInfo) {
                walletConnected = true;
                document.getElementById('walletBtn').innerText = currentLang === 'fa' ? "متصل شد ✅" : "Connected ✅";
            } else {
                walletConnected = false;
                document.getElementById('walletBtn').innerText = currentLang === 'fa' ? "اتصال کیف پول" : "Connect Wallet";
            }
        });

        async function verifyWalletWithFee() {
            if (!tonConnectUI.connected) {
                alert(currentLang === 'fa' ? "لطفاً ابتدا کیف پول خود را از بالای صفحه متصل کنید!" : "Please connect your wallet first!");
                connectWallet();
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [
                    {
                        address: OWNER_WALLET,
                        amount: "10000000" // 0.01 TON
                    }
                ]
            };

            try {
                alert(currentLang === 'fa' ? "لطفاً تراکنش 0.01 TON را در کیف پول خود تایید کنید." : "Please confirm transaction.");
                await tonConnectUI.sendTransaction(transaction);
                
                walletVerified = true;
                userHoldingTier = 2;

                document.getElementById('verifyBtn').style.display = 'none';
                document.getElementById('verifiedDoneBtn').style.display = 'block';
                document.getElementById('holdingStatus').innerText = "💎 سطح هولد: تایید شده (ضریب 2x)";
                document.getElementById('holdingBonus').innerText = "تایید هویت موفقیت‌آمیز بود! 🎉";
                
                updateUI();
                syncUserToDatabase(); // آپدیت وضعیت در دیتابیس ابری
                
                alert(currentLang === 'fa' ? "تایید هویت با موفقیت انجام شد!" : "Verification successful!");
            } catch (error) {
                console.error("Transaction rejected:", error);
                alert(currentLang === 'fa' ? "تراکنش لغو شد یا موجودی کافی نیست." : "Transaction cancelled.");
            }
        }

        async function buyAutoMiner() {
            if (!tonConnectUI.connected) {
                alert(currentLang === 'fa' ? "لطفاً ابتدا کیف پول خود را متصل کنید!" : "Please connect your wallet first!");
                connectWallet();
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [
                    {
                        address: OWNER_WALLET,
                        amount: "500000000" // 0.5 TON
                    }
                ]
            };

            try {
                alert(currentLang === 'fa' ? "تراکنش 0.5 TON برای فعال‌سازی جمع‌کننده خودکار را تایید کنید." : "Confirm 0.5 TON transaction.");
                await tonConnectUI.sendTransaction(transaction);
                
                alert(currentLang === 'fa' ? "جمع‌کننده خودکار با موفقیت فعال شد! 🎉" : "Auto-miner activated successfully!");
            } catch (error) {
                console.error("Auto miner transaction rejected:", error);
                alert(currentLang === 'fa' ? "تراکنش لغو شد یا موجودی کافی نیست." : "Transaction cancelled.");
            }
        }

        let endTime = localStorage.getItem('babygram_end_time');
        let savedHours = localStorage.getItem('babygram_hours');
        let savedReward = localStorage.getItem('babygram_reward');

        if (endTime && savedHours) {
            let now = Date.now();
            let timeLeftSec = Math.floor((parseInt(endTime) - now) / 1000);
            if (timeLeftSec > 0) {
                isMining = true;
                selectedHours = parseInt(savedHours);
                finalReward = parseInt(savedReward);
                startTimerEngine(timeLeftSec);
            } else {
                localStorage.removeItem('babygram_end_time');
            }
        }

        function setParams(hours, reward) {
            if (isMining) return;
            selectedHours = hours;
            baseReward = reward;
            document.querySelectorAll('.options button').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateUI();
        }

        function toggleMining() {
            const btn = document.getElementById('actionBtn');
            const status = document.getElementById('status');

            if (!isMining) {
                isMining = true;
                finalReward = baseReward * userHoldingTier;
                let totalSec = selectedHours * 3600;
                let targetTime = Date.now() + (totalSec * 1000);
                
                localStorage.setItem('babygram_end_time', targetTime);
                localStorage.setItem('babygram_hours', selectedHours);
                localStorage.setItem('babygram_reward', finalReward);

                btn.innerText = currentLang === 'fa' ? "در حال استخراج..." : "Mining...";
                btn.style.background = "#e63946";
                startTimerEngine(totalSec);
            } else {
                userBalance += finalReward;
                localStorage.removeItem('babygram_end_time');
                isMining = false;
                document.getElementById('countdown').innerText = "00:00:00";
                btn.innerText = currentLang === 'fa' ? "شروع
