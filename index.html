<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بیبی‌گرام - BabyGram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; user-select: none; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #38bdf8; text-align: center; }
        .score-box { font-size: 32px; font-weight: 800; margin: 10px 0; color: #facc15; }
        .nav-tabs { display: flex; gap: 5px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 10px; margin-bottom: 15px; width: 100%; justify-content: center; }
        .nav-tab { background: none; border: none; color: #94a3b8; padding: 6px 10px; font-size: 11px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-tab.active { background: #0ea5e9; color: #fff; }
        .tab-content { display: none; width: 100%; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }
        .clicker-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; width: 100%; text-align: center; }
        .coin-btn { background: none; border: none; cursor: pointer; margin: 15px 0; }
        .coin-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #38bdf8; box-shadow: 0 0 20px rgba(14,165,233,0.4); }
        .energy-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 8px; height: 12px; overflow: hidden; margin-top: 15px; }
        .energy-bar { height: 100%; background: #10b981; width: 100%; transition: width 0.2s; }
        .section-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; width: 100%; margin-bottom: 10px; text-align: right; }
        .btn { background: #0ea5e9; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; font-size: 12px; text-align: center; }
        .input-field { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; margin-top: 5px; font-size: 11px; text-align: right; direction: ltr; }
        .info-text { font-size: 10px; color: #94a3b8; margin-top: 4px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">بیبی‌گرام (BabyGram)</div>
        
        <div class="score-box" id="scoreDisplay">0</div>
        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 10px;">موجودی امتیاز شما</div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('clicker', event)">تپ کلیک</button>
            <button class="nav-tab" onclick="switchTab('wallet', event)">کیف‌پول</button>
            <button class="nav-tab" onclick="switchTab('tasks', event)">دعوت دوستان</button>
        </div>

        <!-- تب کلیکر -->
        <div id="clicker" class="tab-content active">
            <div class="clicker-card">
                <button class="coin-btn" onclick="tapCoin()">
                    <img src="IMG_20261107_051306_534.jpg" alt="BabyGram" class="coin-img">
                </button>
                <div class="info-text">برای کسب امتیاز روی سکه ضربه بزنید</div>
                <div class="energy-container">
                    <div class="energy-bar" id="energyBar"></div>
                </div>
                <div class="info-text" style="margin-top: 6px;">انرژی: <span id="energyCount">100</span> / 100</div>
            </div>
        </div>

        <!-- تب کیف پول -->
        <div id="wallet" class="tab-content">
            <div class="section-box">
                <div style="font-size: 13px; font-weight: bold; color: #38bdf8; margin-bottom: 5px;">💎 ثبت آدرس ولت TON</div>
                <div class="info-text" id="walletStatus">آدرس ولت ثبت نشده است</div>
                <input type="text" id="walletInput" class="input-field" placeholder="EQ...">
                <button class="btn" style="background: #10b981;" onclick="saveWallet()">ثبت آدرس ولت</button>
            </div>
        </div>

        <!-- تب دعوت و رفرال -->
        <div id="tasks" class="tab-content">
            <div class="section-box">
                <div style="font-size: 13px; font-weight: bold; color: #38bdf8; margin-bottom: 5px;">👥 دعوت از دوستان</div>
                <div class="info-text">لینک زیر را برای دوستانتان بفرستید:</div>
                <input type="text" id="refLinkInput" class="input-field" readonly>
                <button class="btn" onclick="copyRef()">کپی لینک دعوت</button>
            </div>
        </div>
    </div>

    <script>
        // بازیابی امتیازهای قبلی کاربر (بررسی هر دو مدل کلید برای از دست نرفتن امتیاز)
        let score = parseInt(localStorage.getItem('baby_score')) || parseInt(localStorage.getItem('score')) || 0;
        let energy = 100;
        let wallet = localStorage.getItem('baby_wallet') || '';
        let userId = '7098265955';

        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        document.getElementById('scoreDisplay').innerText = score.toLocaleString();
        let refLink = 'https://t.me/BabyGramClicker_bot?start=ref_' + userId;
        document.getElementById('refLinkInput').value = refLink;

        if (wallet) {
            document.getElementById('walletInput').value = wallet;
            document.getElementById('walletStatus').innerText = 'متصل: ' + wallet.substring(0, 6) + '...' + wallet.substring(wallet.length - 4);
        }

        // پر شدن خودکار انرژی
        setInterval(() => {
            if (energy < 100) {
                energy += 5;
                if (energy > 100) energy = 100;
                document.getElementById('energyBar').style.width = energy + '%';
                document.getElementById('energyCount').innerText = energy;
            }
        }, 1000);

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function tapCoin() {
            if (energy < 10) {
                alert('انرژی شما تمام شده است! کمی صبر کنید.');
                return;
            }
            energy -= 10;
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyCount').innerText = energy;

            score += 1;
            document.getElementById('scoreDisplay').innerText = score.toLocaleString();
            localStorage.setItem('baby_score', score);
        }

        function saveWallet() {
            let val = document.getElementById('walletInput').value.trim();
            if (val.length > 10) {
                wallet = val;
                localStorage.setItem('baby_wallet', wallet);
                document.getElementById('walletStatus').innerText = 'ثبت شد: ' + wallet.substring(0, 6) + '...';
                alert('آدرس ولت با موفقیت ذخیره شد!');
            } else {
                alert('لطفاً یک آدرس معتبر TON وارد کنید.');
            }
        }

        function copyRef() {
            navigator.clipboard.writeText(refLink);
            alert('لینک دعوت کپی شد!');
        }
    </script>
</body>
</html>
